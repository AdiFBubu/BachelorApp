services:
  db:
    image: postgres:16-alpine
    container_name: neuro_guardian_db
    restart: always
    environment:
      POSTGRES_PASSWORD: parola123!A
      POSTGRES_DB: neuro_guardian
    ports:
      - "3491:5432" # map port 5432 in the container to 3491 in Linux
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: